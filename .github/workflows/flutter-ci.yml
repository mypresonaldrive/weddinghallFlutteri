name: Flutter app

on:
  push:
    branches:
      - arena/01a0f024-weddinghallflutteri
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze + unit/widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        id: analyze
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/flutter_app"
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.txt
          code=${PIPESTATUS[0]}
          cd "$GITHUB_WORKSPACE"
          bytes=$(wc -c < flutter_app/analyze.txt || echo 0)
          echo "::notice::analyze exit=$code bytes=$bytes"
          # Human-readable summary (renders on the job page).
          {
            echo "### flutter analyze (exit $code)"
            echo '```'
            head -c 60000 flutter_app/analyze.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Inline annotations for the first errors (correct workspace paths).
          grep -E "^[^ ].*:[0-9]+:[0-9]+: error" flutter_app/analyze.txt | head -10 | while IFS= read -r line; do
            file=$(printf '%s' "$line" | sed -E 's/^(.*):[0-9]+:[0-9]+: error.*$/\\1/')
            pos=$(printf '%s' "$line" | sed -E 's/^.*:([0-9]+):([0-9]+): error.*$/\\1,\\2/')
            msg=$(printf '%s' "$line" | sed -E 's/^.*: error - //')
            echo "::error file=$file,line=${pos%%,*},col=${pos##*,}::$msg"
          done
          # Commit raw output so it is readable from a plain git fetch.
          if [ "$code" -ne 0 ]; then
            mkdir -p ci-logs
            cp flutter_app/analyze.txt ci-logs/analyze-latest.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-logs/analyze-latest.txt
            git diff --cached --quiet && echo "::notice::analyze: nothing staged" || {
              git commit -q -m "ci: capture flutter analyze output [skip ci]"
              echo "::notice::analyze: committed"
              git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" 2>/tmp/pusherr && echo "::notice::analyze: pushed" || echo "::notice::analyze push failed: $(head -c 200 /tmp/pusherr)"
            }
          fi
          exit $code
      - name: Test
        run: flutter test --reporter expanded

  e2e-demo:
    name: E2E against demo server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install server dependencies
        run: npm ci
      - name: Dart deps for e2e tool
        working-directory: flutter_app
        run: flutter pub get
      - name: Start demo server
        run: |
          node server.js > /tmp/demo-server.log 2>&1 &
          echo $! > /tmp/demo-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/config >/dev/null 2>&1; then
              echo "demo server is up"
              exit 0
            fi
            sleep 1
          done
          echo "demo server failed to start"
          cat /tmp/demo-server.log
          exit 1
      - name: Run Flutter e2e
        working-directory: flutter_app
        run: dart run tool/e2e_demo.dart
      - name: Stop demo server
        if: always()
        run: |
          if [ -f /tmp/demo-server.pid ]; then kill "$(cat /tmp/demo-server.pid)" || true; fi
          cat /tmp/demo-server.log || true

  scaffold-state:
    name: Detect platform scaffolds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.check.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f flutter_app/android/build.gradle ] && [ -f flutter_app/windows/runner/main.cpp ]; then
            echo "platforms=true" >> "$GITHUB_OUTPUT"
            echo "Platform scaffolds present."
          else
            echo "platforms=false" >> "$GITHUB_OUTPUT"
            echo "Scaffolds missing - bootstrap will generate them."
          fi

  bootstrap-scaffold:
    name: Bootstrap android/ios/windows scaffolds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [analyze-test, scaffold-state]
    if: ${{ always() && github.event_name == 'push' && needs.scaffold-state.outputs.platforms == 'false' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate scaffold in temp dir
        run: |
          cd "$RUNNER_TEMP"
          flutter create \
            --project-name gatherhall \
            --org com.gatherhall.app \
            --platforms=android,ios,windows \
            gatherhall_scaffold
      - name: Copy platform dirs into flutter_app
        run: |
          src="$RUNNER_TEMP/gatherhall_scaffold"
          dest="$GITHUB_WORKSPACE/flutter_app"
          echo "::notice::generated: $(find "$src" -maxdepth 2 -mindepth 1 | sed "s|$src/||" | sort | tr '\n' ' ')"
          rsync -a \
            --exclude '/lib' \
            --exclude '/test' \
            --exclude 'pubspec.yaml' \
            --exclude 'pubspec.lock' \
            --exclude 'analysis_options.yaml' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            "$src/" "$dest/"
          for plat in android ios windows; do
            if [ -z "$(ls -A "$dest/$plat" 2>/dev/null)" ]; then
              echo "::error::platform dir $plat missing or empty after copy"
              find "$src/$plat" 2>/dev/null | head -30
              exit 1
            fi
          done
          echo "::notice::copied: android=$(find "$dest/android" -type f | wc -l) ios=$(find "$dest/ios" -type f | wc -l) windows=$(find "$dest/windows" -type f | wc -l) files"
          echo "::notice::main activity: $(find "$dest/android" -name 'MainActivity*' | head -3 | tr '\n' ' ')"
      - name: Commit scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A flutter_app
          if git diff --cached --quiet; then
            echo "Scaffold already up to date."
          else
            git commit -m "chore(flutter): bootstrap platform scaffolds [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [analyze-test, scaffold-state, bootstrap-scaffold]
    if: ${{ !cancelled() && needs.analyze-test.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Check scaffold
        id: check
        continue-on-error: true
        run: test -f flutter_app/android/build.gradle
      - uses: subosito/flutter-action@v2
        if: steps.check.outcome == 'success'
        with:
          channel: stable
          cache: true
      - name: Pub get
        if: steps.check.outcome == 'success'
        working-directory: flutter_app
        run: flutter pub get
      - name: Build APK (release, debug-signed)
        if: steps.check.outcome == 'success'
        working-directory: flutter_app
        run: flutter build apk --release
      - name: Notice
        if: steps.check.outcome != 'success'
        run: echo "::warning::Android scaffold missing - run bootstrap first."

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [analyze-test, scaffold-state, bootstrap-scaffold]
    if: ${{ !cancelled() && needs.analyze-test.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Check scaffold
        id: check
        continue-on-error: true
        shell: bash
        run: test -f flutter_app/windows/runner/main.cpp
      - uses: subosito/flutter-action@v2
        if: steps.check.outcome == 'success'
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        if: steps.check.outcome == 'success'
        run: flutter config --enable-windows-desktop
      - name: Pub get
        if: steps.check.outcome == 'success'
        working-directory: flutter_app
        run: flutter pub get
      - name: Build Windows release
        if: steps.check.outcome == 'success'
        working-directory: flutter_app
        run: flutter build windows --release

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [analyze-test, scaffold-state, bootstrap-scaffold]
    if: ${{ !cancelled() && needs.analyze-test.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Check scaffold
        id: check
        continue-on-error: true
        run: test -f flutter_app/ios/Runner/Runner.xcodeproj/project.pbxproj || test -d flutter_app/ios/Runner
      - uses: subosito/flutter-action@v2
        if: steps.check.outcome == 'success'
        with:
          channel: stable
          cache: true
      - name: Pub get
        if: steps.check.outcome == 'success'
        working-directory: flutter_app
        run: flutter pub get
      - name: Build iOS
        if: steps.check.outcome == 'success'
        working-directory: flutter_app
        run: flutter build ios --no-codesign --release
