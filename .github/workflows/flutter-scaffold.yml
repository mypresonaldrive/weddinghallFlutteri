name: Flutter scaffold bootstrap

# One-shot generator: runs `flutter create` in a temp dir and commits the
# android/ ios/ windows/ platform scaffolds (plus .metadata) back onto the
# session branch. GitHub blocks artifact downloads from this sandbox, so the
# generated tree must be committed instead.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate scaffold in temp dir
        run: |
          cd "$RUNNER_TEMP"
          flutter create \
            --project-name gatherhall \
            --org com.gatherhall.app \
            --platforms=android,ios,windows \
            gatherhall_scaffold
      - name: Copy platform dirs into flutter_app
        run: |
          src="$RUNNER_TEMP/gatherhall_scaffold"
          dest="$GITHUB_WORKSPACE/flutter_app"
          rsync -a \
            --exclude '/lib' \
            --exclude '/test' \
            --exclude 'pubspec.yaml' \
            --exclude 'pubspec.lock' \
            --exclude 'analysis_options.yaml' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            "$src/" "$dest/"
          # Keep the hand-written project files; adopt only what the tooling
          # needs to recognize platforms.
          ls -la "$dest"
          test -f "$dest/android/app/src/main/kotlin/com/gatherhall/app/MainActivity.kt"
          test -f "$dest/windows/runner/main.cpp"
          test -d "$dest/ios/Runner"
      - name: Commit scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A flutter_app
          if git diff --cached --quiet; then
            echo "Scaffold already up to date."
          else
            git commit -m "chore(flutter): bootstrap android/ios/windows scaffolds"
            git push
          fi
